<style>
:root{
  --paper:#FBF8F5;--surface:#FFFFFF;--surface-2:#F4EEE9;--surface-3:#EAE1DA;
  --ink:#1E1719;--ink-2:#4E4348;--muted:#7F7176;
  --rule:#E7DED8;--rule-2:#D2C5BD;
  --arterial:#B0142C;--arterial-soft:#FBEAEC;
  --venous:#1F5E86;--venous-soft:#E7F0F6;
  --leaf:#2C6B4F;--leaf-soft:#E5F1EA;
  --sun:#9A6B12;--sun-soft:#FBF0DC;
  --r-lg:14px;--r-md:9px;
  --shadow:0 1px 2px rgba(30,23,25,.05),0 12px 30px -22px rgba(30,23,25,.4);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15100F;--surface:#1E1817;--surface-2:#271F1E;--surface-3:#332A28;
  --ink:#F5EDE9;--ink-2:#D3C5C0;--muted:#9E8E89;--rule:#312826;--rule-2:#4A3D3A;
  --arterial:#F0687C;--arterial-soft:#361C21;--venous:#7CB4DC;--venous-soft:#132632;
  --leaf:#6FC79B;--leaf-soft:#132A21;--sun:#E0AC50;--sun-soft:#2C2317;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -22px rgba(0,0,0,.95);
}}
:root[data-theme="dark"]{
  --paper:#15100F;--surface:#1E1817;--surface-2:#271F1E;--surface-3:#332A28;
  --ink:#F5EDE9;--ink-2:#D3C5C0;--muted:#9E8E89;--rule:#312826;--rule-2:#4A3D3A;
  --arterial:#F0687C;--arterial-soft:#361C21;--venous:#7CB4DC;--venous-soft:#132632;
  --leaf:#6FC79B;--leaf-soft:#132A21;--sun:#E0AC50;--sun-soft:#2C2317;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 30px -22px rgba(0,0,0,.95);
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.02em;margin:0;text-wrap:balance}
button{font-family:inherit;font-size:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--arterial);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:36px 20px 90px}
header.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);
  padding-bottom:16px;margin-bottom:26px}
header.top .l{margin-right:auto}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--arterial);margin:0 0 9px}
header.top h1{font-size:clamp(28px,4.6vw,40px);font-weight:700;line-height:1.05}
.btn{background:var(--ink);color:var(--paper);border:none;padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px}
.btn.ghost{background:var(--surface);border:1px solid var(--rule-2);color:var(--ink)}
.btn:hover{opacity:.88}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
h2.sec{font-size:22px;font-weight:700;margin:46px 0 3px}
p.sub{color:var(--muted);font-size:14px;margin:0 0 18px;max-width:64ch}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 8px}
.kpi div{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:15px 17px}
.kpi .v{font-family:Fraunces,serif;font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.35}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin:18px 0}
.person{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.person .ph{display:flex;align-items:baseline;gap:10px;margin-bottom:3px;flex-wrap:wrap}
.person h3{font-size:19px;font-weight:700}
.person .pill{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;margin-left:auto}
.pill.aktif{background:var(--leaf-soft);color:var(--leaf)}
.pill.jarang{background:var(--sun-soft);color:var(--sun)}
.pill.diam{background:var(--arterial-soft);color:var(--arterial)}
.person .last{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.spark{margin:4px 0 14px}
.spark svg{width:100%;height:56px;display:block;overflow:visible}
.spark .cap{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-top:4px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:13px;border-top:1px solid var(--rule)}
.pstats div .v{font-family:"IBM Plex Mono",monospace;font-size:17px;font-variant-numeric:tabular-nums}
.pstats div .l{font-size:11.5px;color:var(--muted);line-height:1.3}
.weak{margin-top:13px;padding-top:12px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--ink-2)}
.weak b{color:var(--arterial);font-weight:600}
.tblwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--surface);margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:13.8px;min-width:700px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule)}
thead th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);background:var(--surface-2);font-weight:500}
tbody tr:last-child td{border-bottom:none}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.miss{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule)}
.miss:last-child{border-bottom:none}
.miss .cnt{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--arterial);background:var(--arterial-soft);
  padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none}
.miss .q{font-size:14px;line-height:1.45}
.miss .q small{display:block;color:var(--muted);font-size:11.5px;font-family:"IBM Plex Mono",monospace;margin-top:2px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-md);padding:6px 20px;margin:16px 0}
.note{border-left:3px solid var(--venous);background:var(--venous-soft);padding:14px 18px;margin:18px 0;
  font-size:13.8px;line-height:1.55;border-radius:0 6px 6px 0}
.note b{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--venous);margin-bottom:4px}
.warn{border-left:3px solid var(--sun);background:var(--sun-soft);padding:14px 18px;margin:18px 0;
  font-size:13.8px;line-height:1.55;border-radius:0 6px 6px 0}
.warn b{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--sun);margin-bottom:4px}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:14.5px}
.setup{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-lg);padding:24px;max-width:620px}
.setup code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:4px}
.setup ol{padding-left:19px;margin:12px 0 0}
.setup li{margin-bottom:8px}
footer{border-top:1px solid var(--rule);margin-top:56px;padding-top:18px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const $ = s => document.querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;};

function kapan(iso){
  const d = new Date(iso); if (isNaN(d)) return "—";
  const menit = Math.round((Date.now()-d.getTime())/60000);
  if (menit < 2) return "baru saja";
  if (menit < 60) return menit + " menit lalu";
  const jam = Math.round(menit/60);
  if (jam < 24) return jam + " jam lalu";
  const hari = Math.round(jam/24);
  if (hari === 1) return "kemarin";
  if (hari < 30) return hari + " hari lalu";
  return d.toLocaleDateString("id-ID",{day:"numeric",month:"short"});
}
function tanggalJam(iso){
  const d = new Date(iso); if (isNaN(d)) return "—";
  return d.toLocaleDateString("id-ID",{day:"numeric",month:"short"}) + ", " +
         d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
}
const pct = r => Math.round(r.skor / r.maks * 100);

function tampilSetup(){
  const isi = $("#isi"); isi.textContent = "";
  const s = el("div","setup");
  s.appendChild(el("h3",null,"Dasbor belum tersambung"));
  s.appendChild(el("p",null,"Isi dulu dua baris pengaturan di bagian atas berkas ini, kemudian unggah ulang. Nilainya sama persis dengan yang kamu isikan di index.html."));
  const ol = el("ol");
  ["Buka supabase.com, masuk ke proyekmu.",
   "Klik Settings, lalu API.",
   "Salin Project URL ke SUPABASE_URL, dan kunci anon public ke SUPABASE_KEY."]
   .forEach(t => ol.appendChild(el("li",null,t)));
  s.appendChild(ol);
  isi.appendChild(s);
}

function muat(){
  if (!SUPABASE_URL || !SUPABASE_KEY){ tampilSetup(); return; }
  $("#isi").textContent = ""; $("#isi").appendChild(el("div","empty","Memuat data…"));
  fetch(SUPABASE_URL.replace(/\/+$/,"") + "/rest/v1/hasil?select=*&order=waktu.desc&limit=1000", {
    headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(e => {
      const isi = $("#isi"); isi.textContent = "";
      const w = el("div","warn");
      w.appendChild(el("b",null,"Gagal memuat"));
      w.appendChild(document.createTextNode("Data tidak bisa diambil (" + e.message + "). Periksa kembali URL dan kunci di bagian pengaturan, serta pastikan tabel hasil sudah dibuat beserta aturan aksesnya."));
      isi.appendChild(w);
    });
}
$("#btn-refresh").onclick = muat;

function render(rows){
  const isi = $("#isi"); isi.textContent = "";
  if (!rows.length){
    isi.appendChild(el("div","empty","Belum ada hasil yang masuk. Begitu ada yang menyelesaikan latihan, datanya muncul di sini."));
    return;
  }
  rows.sort((a,b) => new Date(b.waktu) - new Date(a.waktu));

  /* ---- ringkasan tim ---- */
  const nama = Array.from(new Set(rows.map(r => r.nama)));
  const soalTotal = rows.reduce((s,r) => s + (r.jumlah_soal||0), 0);
  const rata = Math.round(rows.reduce((s,r) => s + pct(r), 0) / rows.length);
  const menitTotal = Math.round(rows.reduce((s,r) => s + (r.durasi_detik||0), 0) / 60);
  const kpi = el("div","kpi");
  [[rows.length,"pengerjaan tercatat"],[nama.length,"peserta aktif"],
   [soalTotal.toLocaleString("id-ID"),"soal dikerjakan"],[rata + "%","rata-rata capaian tim"],
   [menitTotal + " mnt","total waktu belajar"]]
  .forEach(([v,l]) => { const d = el("div"); d.appendChild(el("div","v",String(v))); d.appendChild(el("div","l",l)); kpi.appendChild(d); });
  isi.appendChild(kpi);
  const st = el("p","stamp","Diperbarui " + tanggalJam(new Date().toISOString()));
  st.style.marginTop = "10px"; isi.appendChild(st);

  /* ---- per peserta ---- */
  isi.appendChild(el("h2","sec","Per peserta"));
  isi.appendChild(el("p","sub","Grafik menunjukkan capaian tiap pengerjaan berurutan dari kiri ke kanan. Yang penting arahnya, bukan satu titik tertingginya."));
  const grid = el("div","people");
  nama.map(n => {
    const mine = rows.filter(r => r.nama === n).slice().sort((a,b) => new Date(a.waktu) - new Date(b.waktu));
    return {n, mine};
  }).sort((a,b) => b.mine.length - a.mine.length).forEach(({n,mine}) => {
    grid.appendChild(kartuPeserta(n, mine));
  });
  isi.appendChild(grid);

  /* ---- soal tersering salah ---- */
  const tally = {};
  rows.forEach(r => {
    (r.salah_nomor || []).forEach(no => {
      const k = r.course + "#" + no;
      tally[k] = (tally[k] || 0) + 1;
    });
  });
  const top = Object.keys(tally).map(k => ({k, c:tally[k]}))
    .filter(x => x.c > 1).sort((a,b) => b.c - a.c).slice(0,12);
  isi.appendChild(el("h2","sec","Soal yang paling sering salah"));
  isi.appendChild(el("p","sub","Hanya menampilkan soal yang salah lebih dari sekali. Inilah bahan pembahasan bersama yang paling terarah."));
  const box = el("div","box");
  if (!top.length){
    box.appendChild(el("div","empty","Belum ada pola yang muncul. Butuh beberapa pengerjaan lagi supaya terlihat."));
  } else {
    top.forEach(x => {
      const [course, no] = x.k.split("#");
      const info = (INDEX_SOAL[course] || {})[no];
      const row = el("div","miss");
      row.appendChild(el("span","cnt", x.c + "× salah"));
      const q = el("div","q");
      q.appendChild(document.createTextNode(info ? info.s : "Soal nomor " + no));
      q.appendChild(el("small",null, (info ? info.b + " · " : "") + namaCourse(course) + " nomor " + no));
      row.appendChild(q);
      box.appendChild(row);
    });
  }
  isi.appendChild(box);

  /* ---- tabel ---- */
  isi.appendChild(el("h2","sec","Seluruh pengerjaan"));
  isi.appendChild(el("p","sub","Terbaru di atas. Perhatikan kolom benar, salah, dan kosong — pola menebak lebih terbaca dari situ daripada dari skornya."));
  const wrap = el("div","tblwrap"); const t = el("table");
  const th = el("thead"); const tr = el("tr");
  ["Peserta","Paket","Bagian","Skor","Capaian","B / S / K","Durasi","Waktu"].forEach(h => tr.appendChild(el("th",null,h)));
  th.appendChild(tr); t.appendChild(th);
  const tb = el("tbody");
  rows.forEach(r => {
    const row = el("tr");
    row.appendChild(el("td",null,r.nama));
    row.appendChild(el("td",null,r.course_nama || namaCourse(r.course)));
    row.appendChild(el("td",null,r.mode === "all" ? "Semua" : r.mode));
    row.appendChild(el("td","n", r.skor + " / " + r.maks));
    const p = pct(r); const tdp = el("td","n", p + "%");
    tdp.style.color = p >= 66 ? "var(--leaf)" : (p >= 40 ? "var(--ink)" : "var(--arterial)");
    tdp.style.fontWeight = "600";
    row.appendChild(tdp);
    row.appendChild(el("td","n", r.benar + " / " + r.salah + " / " + r.kosong));
    row.appendChild(el("td","n", Math.floor((r.durasi_detik||0)/60) + " mnt" + (r.otomatis ? " ⏱" : "")));
    row.appendChild(el("td","n", tanggalJam(r.waktu)));
    tb.appendChild(row);
  });
  t.appendChild(tb); wrap.appendChild(t); isi.appendChild(wrap);

  const n1 = el("div","note");
  n1.appendChild(el("b",null,"Membaca tabel ini"));
  n1.appendChild(document.createTextNode("Tanda ⏱ pada kolom durasi berarti waktunya habis dan jawaban terkumpul otomatis. Banyak salah dengan sedikit kosong menandakan terlalu berani menebak; banyak kosong menandakan terlalu berhati-hati atau kehabisan waktu."));
  isi.appendChild(n1);
}

function namaCourse(id){
  return id === "simulasi" ? "Simulasi Penuh" : id === "kardio" ? "Kardiovaskular" : id === "pendalaman" ? "Pendalaman" : id;
}

function kartuPeserta(n, mine){
  const card = el("div","person");
  const ph = el("div","ph");
  ph.appendChild(el("h3",null,n));
  const terakhir = new Date(mine[mine.length-1].waktu);
  const hariLalu = (Date.now() - terakhir.getTime()) / 86400000;
  const kelas = hariLalu <= 2 ? "aktif" : hariLalu <= 5 ? "jarang" : "diam";
  const teks = hariLalu <= 2 ? "Aktif" : hariLalu <= 5 ? "Mulai jarang" : "Lama tidak latihan";
  ph.appendChild(el("span","pill " + kelas, teks));
  card.appendChild(ph);
  card.appendChild(el("p","last","Terakhir latihan " + kapan(mine[mine.length-1].waktu)));

  /* sparkline */
  const vals = mine.map(pct);
  const sp = el("div","spark");
  const W = 300, H = 56, pad = 4;
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox","0 0 " + W + " " + H);
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Grafik capaian " + n + " dari " + vals.length + " pengerjaan");
  const x = i => vals.length === 1 ? W/2 : pad + i * (W - pad*2) / (vals.length - 1);
  const y = v => H - pad - (v/100) * (H - pad*2);
  const base = document.createElementNS(svgNS,"line");
  base.setAttribute("x1",0); base.setAttribute("x2",W);
  base.setAttribute("y1",y(0)); base.setAttribute("y2",y(0));
  base.setAttribute("stroke","currentColor"); base.setAttribute("stroke-opacity",".18");
  svg.appendChild(base);
  if (vals.length > 1){
    const line = document.createElementNS(svgNS,"polyline");
    line.setAttribute("points", vals.map((v,i) => x(i) + "," + y(v)).join(" "));
    line.setAttribute("fill","none");
    line.setAttribute("stroke","var(--venous)");
    line.setAttribute("stroke-width","2");
    line.setAttribute("stroke-linejoin","round");
    line.setAttribute("stroke-linecap","round");
    svg.appendChild(line);
  }
  vals.forEach((v,i) => {
    const c = document.createElementNS(svgNS,"circle");
    c.setAttribute("cx",x(i)); c.setAttribute("cy",y(v)); c.setAttribute("r", i === vals.length-1 ? 4 : 2.6);
    c.setAttribute("fill", i === vals.length-1 ? "var(--arterial)" : "var(--venous)");
    svg.appendChild(c);
  });
  const lastLabel = document.createElementNS(svgNS,"text");
  lastLabel.setAttribute("x", Math.min(x(vals.length-1) + 7, W - 2));
  lastLabel.setAttribute("y", Math.max(y(vals[vals.length-1]) - 7, 11));
  lastLabel.setAttribute("text-anchor", x(vals.length-1) > W - 40 ? "end" : "start");
  lastLabel.setAttribute("font-family","IBM Plex Mono, monospace");
  lastLabel.setAttribute("font-size","11");
  lastLabel.setAttribute("fill","var(--arterial)");
  lastLabel.textContent = vals[vals.length-1] + "%";
  svg.appendChild(lastLabel);
  sp.appendChild(svg);
  const arah = vals.length > 1
    ? (vals[vals.length-1] > vals[0] ? "Naik " + (vals[vals.length-1]-vals[0]) + " poin sejak latihan pertama"
      : vals[vals.length-1] < vals[0] ? "Turun " + (vals[0]-vals[vals.length-1]) + " poin sejak latihan pertama"
      : "Belum banyak berubah sejak latihan pertama")
    : "Baru satu kali latihan";
  sp.appendChild(el("div","cap",arah));
  card.appendChild(sp);

  const stats = el("div","pstats");
  const hariAktif = new Set(mine.map(r => new Date(r.waktu).toDateString())).size;
  const menit = Math.round(mine.reduce((s,r) => s + (r.durasi_detik||0), 0)/60);
  [[mine.length,"latihan"],[hariAktif,"hari aktif"],[menit + "m","total waktu"]].forEach(([v,l]) => {
    const d = el("div"); d.appendChild(el("div","v",String(v))); d.appendChild(el("div","l",l)); stats.appendChild(d);
  });
  card.appendChild(stats);

  /* bidang terlemah */
  const agg = {};
  mine.forEach(r => {
    const pb = r.per_bidang || {};
    Object.keys(pb).forEach(b => {
      const a = agg[b] || (agg[b] = {benar:0,total:0});
      a.benar += pb[b].benar; a.total += pb[b].total;
    });
  });
  const daftar = Object.keys(agg).map(b => ({b, p: agg[b].benar/agg[b].total}));
  if (daftar.length){
    daftar.sort((a,b) => a.p - b.p);
    const w = el("div","weak");
    const lemah = daftar[0], kuat = daftar[daftar.length-1];
    w.appendChild(document.createTextNode("Paling perlu dibantu: "));
    w.appendChild(el("b",null, lemah.b + " (" + Math.round(lemah.p*100) + "%)"));
    if (daftar.length > 1){
      w.appendChild(document.createTextNode(" · sudah kuat di " + kuat.b + " (" + Math.round(kuat.p*100) + "%)"));
    }
    card.appendChild(w);
  }
  return card;
}

muat();
</script>
